<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D16"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="22.5" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" stroke-dasharray="4 8"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke-dasharray="4 8"/>
    <line x1="550" y1="0" x2="550" y2="400" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke-dasharray="4 8"/>
    <line x1="850" y1="0" x2="850" y2="400" stroke-dasharray="4 8"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke-dasharray="4 8"/>
    <line x1="1150" y1="0" x2="1150" y2="400" stroke-dasharray="4 8"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="1020" cy="180" r="140" fill="url(#grad)" opacity="0.12" filter="url(#glow)"/>
  <circle cx="200" cy="320" r="90" fill="url(#grad)" opacity="0.08" filter="url(#glow)"/>

  <!-- Badge Pill -->
  <g transform="translate(80, 80)">
    <rect width="450" height="36" rx="18" fill="#1E293B" stroke="url(#grad)" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#10B981"/>
    <text x="36" y="23" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">QUICK-COMMERCE & FLEET DISPATCH ENGINE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="185" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">RK RAJAK ABS</text>
  <text x="80" y="235" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="400">Node.js · TypeScript · Express · Prisma · MongoDB · Multi-Branch Inventory · Driver Incentive Tiers · Wallet</text>

  <!-- Tech Highlights Pills -->
  <g transform="translate(80, 275)">
    <rect width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="65" y="21" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">TypeScript</text>
  </g>
  <g transform="translate(220, 275)">
    <rect width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="65" y="21" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Quick-Commerce</text>
  </g>
  <g transform="translate(360, 275)">
    <rect width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="65" y="21" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Driver Incentives</text>
  </g>
  <g transform="translate(500, 275)">
    <rect width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="65" y="21" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Wallet & Rewards</text>
  </g>

  <!-- Isometric Server Block -->
  <g transform="translate(920, 110)">
    <polygon points="110,30 190,75 110,120 30,75" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <polygon points="30,75 110,120 110,180 30,135" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <polygon points="190,75 110,120 110,180 190,135" fill="#1E293B" stroke="#10B981" stroke-width="2"/>

    <polygon points="110,-5 175,32 110,69 45,32" fill="#334155" stroke="#FFFFFF" stroke-width="1.5"/>

    <circle cx="110" cy="-5" r="5" fill="#10B981"/>
    <circle cx="175" cy="32" r="5" fill="#FFFFFF"/>
    <circle cx="45" cy="32" r="5" fill="#10B981"/>
    <circle cx="110" cy="120" r="6" fill="#10B981"/>
    <circle cx="110" cy="180" r="5" fill="#10B981"/>
  </g>
</svg>