<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080E1A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="22.5" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>

  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" stroke-dasharray="4 8"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke-dasharray="4 8"/>
    <line x1="550" y1="0" x2="550" y2="400" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke-dasharray="4 8"/>
    <line x1="850" y1="0" x2="850" y2="400" stroke-dasharray="4 8"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke-dasharray="4 8"/>
    <line x1="1150" y1="0" x2="1150" y2="400" stroke-dasharray="4 8"/>
  </g>

  <circle cx="1000" cy="150" r="120" fill="url(#grad)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="200" cy="300" r="80" fill="url(#grad)" opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(80, 85)">
    <rect width="340" height="36" rx="18" fill="#1E293B" stroke="url(#grad)" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#10B981"/>
    <text x="36" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">SUPPLY CHAIN & DISPATCH</text>
  </g>

  <text x="80" y="190" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5">RK RAJAK ABS</text>
  <text x="80" y="240" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Fresh Produce & Agro-Logistics Distribution Engine</text>

  <g transform="translate(920, 140)" stroke="url(#grad)" stroke-width="2.5" fill="none">
    <polygon points="60,10 110,40 110,100 60,130 10,100 10,40" fill="#1E293B" fill-opacity="0.6"/>
    <line x1="60" y1="10" x2="60" y2="70"/>
    <line x1="60" y1="70" x2="110" y2="100"/>
    <line x1="60" y1="70" x2="10" y2="100"/>
    <circle cx="60" cy="10" r="4" fill="#10B981"/>
    <circle cx="110" cy="40" r="4" fill="#059669"/>
    <circle cx="10" cy="40" r="4" fill="#10B981"/>
    <circle cx="60" cy="70" r="5" fill="#FFFFFF"/>
    <circle cx="110" cy="100" r="4" fill="#059669"/>
    <circle cx="10" cy="100" r="4" fill="#10B981"/>
    <circle cx="60" cy="130" r="4" fill="#059669"/>
  </g>
</svg>