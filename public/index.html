<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Recharge - RK-Razak ABS Fruits</title>

    <!-- Cashfree SDK -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

    <!-- 
      ⚠️ IMPORTANT: How to access this page correctly ⚠️
      
      Option 1 (RECOMMENDED): Access through backend server
      - Start your backend: bun run dev
      - Open: http://localhost:3000/ (or your backend port)
      
      Option 2: If using Live Server/file:// protocol
      - Update BACKEND_PORT variable in the script section below
      - Make sure CORS is enabled on your backend
      - Ensure backend is running on the specified port
    -->

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .content {
        padding: 30px;
      }

      .form-group {
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 14px;
      }

      input[type="number"],
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .amount-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 10px;
      }

      .amount-btn {
        padding: 12px;
        border: 2px solid #e0e0e0;
        background: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        color: #667eea;
        transition: all 0.3s ease;
      }

      .amount-btn:hover {
        background: #f5f7ff;
        border-color: #667eea;
      }

      .amount-btn.active {
        background: #667eea;
        color: white;
        border-color: #667eea;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .alert {
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      .alert.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
        display: block;
      }

      .alert.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        display: block;
      }

      .alert.info {
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
        display: block;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 20px;
      }

      .loading.active {
        display: block;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .auth-section {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .auth-section small {
        display: block;
        color: #666;
        margin-top: 5px;
        font-size: 12px;
      }

      .token-status {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        margin-top: 10px;
      }

      .token-status.valid {
        background: #d4edda;
        color: #155724;
      }

      .token-status.invalid {
        background: #f8d7da;
        color: #721c24;
      }

      code {
        background: rgba(0, 0, 0, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: "Courier New", monospace;
        font-size: 13px;
      }

      .alert code {
        background: rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>💰 Wallet Recharge</h1>
        <p>Recharge your wallet securely via Cashfree</p>
      </div>

      <div class="content">
        <div id="alert" class="alert"></div>

        <!-- Important Notice -->
        <div class="alert info" id="portNotice" style="display: block">
          <strong>ℹ️ Important:</strong> Make sure your backend server is
          running on port <strong id="displayPort">3000</strong>. If it's on a
          different port, edit the <code>BACKEND_PORT</code> variable in the
          page source.
        </div>

        <!-- Authentication Section -->
        <div class="auth-section">
          <div class="form-group">
            <label for="authToken">🔐 Authentication Token (JWT)</label>
            <input
              type="password"
              id="authToken"
              placeholder="Enter your JWT token"
              autocomplete="off"
            />
            <small
              >Get your token after login from the /auth/login endpoint</small
            >
            <div id="tokenStatus"></div>
          </div>
        </div>

        <!-- Recharge Form -->
        <form id="rechargeForm">
          <div class="form-group">
            <label for="amount">💵 Recharge Amount (₹)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="Enter amount"
              min="1"
              step="1"
              required
            />

            <div class="amount-options">
              <button type="button" class="amount-btn" data-amount="100">
                ₹100
              </button>
              <button type="button" class="amount-btn" data-amount="500">
                ₹500
              </button>
              <button type="button" class="amount-btn" data-amount="1000">
                ₹1000
              </button>
              <button type="button" class="amount-btn" data-amount="2000">
                ₹2000
              </button>
              <button type="button" class="amount-btn" data-amount="5000">
                ₹5000
              </button>
              <button type="button" class="amount-btn" data-amount="10000">
                ₹10000
              </button>
            </div>
          </div>

          <button type="submit" class="btn" id="submitBtn">
            Proceed to Payment
          </button>
        </form>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p style="margin-top: 15px; color: #666">
            Processing your request...
          </p>
        </div>
      </div>
    </div>

    <script>
      // Configuration - Update this URL to match your backend server
      // Common ports: 3000, 5000, 8000
      const BACKEND_PORT = 8001; // Change this if your backend runs on a different port
      const API_BASE_URL = `https://api.absfresh.co.in/api/v1`;
      const RECHARGE_ENDPOINT = `${API_BASE_URL}/payment/wallet/recharge`;

      console.log("🔧 API Configuration:", {
        backendPort: BACKEND_PORT,
        apiBaseUrl: API_BASE_URL,
        rechargeEndpoint: RECHARGE_ENDPOINT,
      });

      // Elements
      const form = document.getElementById("rechargeForm");
      const amountInput = document.getElementById("amount");
      const authTokenInput = document.getElementById("authToken");
      const submitBtn = document.getElementById("submitBtn");
      const loading = document.getElementById("loading");
      const alertBox = document.getElementById("alert");
      const tokenStatus = document.getElementById("tokenStatus");
      const amountButtons = document.querySelectorAll(".amount-btn");

      // Quick amount selection
      amountButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const amount = btn.getAttribute("data-amount");
          amountInput.value = amount;

          // Update active state
          amountButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });

      // Save token to localStorage
      authTokenInput.addEventListener("input", (e) => {
        const token = e.target.value.trim();
        if (token) {
          localStorage.setItem("authToken", token);
          updateTokenStatus(true);
        } else {
          localStorage.removeItem("authToken");
          updateTokenStatus(false);
        }
      });

      // Update token status indicator
      function updateTokenStatus(isValid) {
        if (isValid) {
          tokenStatus.innerHTML =
            '<span class="token-status valid">✓ Token Saved</span>';
        } else {
          tokenStatus.innerHTML =
            '<span class="token-status invalid">✗ Token Required</span>';
        }
      }

      // Test backend connection
      async function testBackendConnection() {
        try {
          const response = await fetch(`https://api.absfresh.co.in`, {
            method: "GET",
          });

          if (response.ok) {
            console.log("✅ Backend connection successful");
            const portNotice = document.getElementById("portNotice");
            if (portNotice) {
              portNotice.innerHTML =
                "<strong>✅ Connected:</strong> Backend server detected on port <strong>" +
                BACKEND_PORT +
                "</strong>";
              portNotice.className = "alert success";
            }
          } else {
            console.warn(
              "⚠️ Backend responded but with status:",
              response.status
            );
          }
        } catch (error) {
          console.error("❌ Backend connection failed:", error);
          const portNotice = document.getElementById("portNotice");
          if (portNotice) {
            portNotice.innerHTML =
              "<strong>❌ Connection Failed:</strong> Cannot connect to backend on port <strong>" +
              BACKEND_PORT +
              "</strong>. Please ensure the server is running.";
            portNotice.className = "alert error";
          }
        }
      }

      // Show alert message
      function showAlert(message, type = "info") {
        alertBox.textContent = message;
        alertBox.className = `alert ${type}`;
        alertBox.style.display = "block";

        // Auto hide success messages after 5 seconds
        if (type === "success") {
          setTimeout(() => {
            alertBox.style.display = "none";
          }, 5000);
        }
      }

      // Hide alert
      function hideAlert() {
        alertBox.style.display = "none";
      }

      // Show loading spinner
      function showLoading() {
        loading.classList.add("active");
        submitBtn.disabled = true;
        form.style.display = "none";
      }

      // Hide loading spinner
      function hideLoading() {
        loading.classList.remove("active");
        submitBtn.disabled = false;
        form.style.display = "block";
      }

      // Initialize Cashfree SDK
      let cashfree;
      const initializeCashfree = async () => {
        try {
          // Initialize Cashfree in sandbox mode
          cashfree = await Cashfree({ mode: "sandbox" });
          console.log("✅ Cashfree SDK initialized");
        } catch (error) {
          console.error("❌ Failed to initialize Cashfree SDK:", error);
          showAlert("❌ Failed to initialize payment gateway", "error");
        }
      };

      // Initialize on page load
      window.addEventListener("DOMContentLoaded", async () => {
        const savedToken = localStorage.getItem("authToken");
        if (savedToken) {
          authTokenInput.value = savedToken;
          updateTokenStatus(true);
        }

        // Update displayed port in notice
        const displayPort = document.getElementById("displayPort");
        if (displayPort) {
          displayPort.textContent = BACKEND_PORT;
        }

        // Initialize Cashfree SDK
        await initializeCashfree();

        // Test backend connection
        testBackendConnection();
      });

      // Handle form submission
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert();

        const token = authTokenInput.value.trim();
        const amount = parseFloat(amountInput.value);

        // Validation
        if (!token) {
          showAlert("⚠️ Please enter your authentication token", "error");
          authTokenInput.focus();
          return;
        }

        if (!amount || amount <= 0) {
          showAlert("⚠️ Please enter a valid amount greater than 0", "error");
          amountInput.focus();
          return;
        }

        if (!cashfree) {
          showAlert(
            "⚠️ Payment gateway not initialized. Please refresh the page.",
            "error"
          );
          return;
        }

        showLoading();

        try {
          // Call backend to create payment session
          const response = await fetch(RECHARGE_ENDPOINT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `${token}`,
            },
            body: JSON.stringify({ amount }),
          });

          const data = await response.json();
          console.log({ data });
          if (response.ok && data.success) {
            // Get payment session ID from backend
            const paymentSessionId = data.result.payment_session_id;
            console.log({ paymentSessionId, data });
            console.log("✅ Payment Session ID received:", payment_session_id);

            hideLoading();
            showAlert("🔄 Opening Cashfree checkout...", "info");

            // Open Cashfree checkout with session ID
            const checkoutOptions = {
              paymentSessionId: paymentSessionId,
              redirectTarget: "_modal", // Opens in modal/popup
            };

            console.log(
              "🚀 Launching Cashfree checkout with options:",
              checkoutOptions
            );

            // Launch Cashfree checkout
            cashfree
              .checkout(checkoutOptions)
              .then((result) => {
                console.log("💳 Checkout completed:", result);

                if (result.error) {
                  // Handle checkout errors
                  console.error("❌ Checkout error:", result.error);
                  showAlert(
                    `❌ Payment failed: ${
                      result.error.message || "Unknown error"
                    }`,
                    "error"
                  );
                } else if (result.paymentDetails) {
                  // Payment successful
                  console.log("✅ Payment successful:", result.paymentDetails);
                  showAlert(
                    "✅ Payment completed successfully! Redirecting...",
                    "success"
                  );

                  // Redirect or refresh after successful payment
                  setTimeout(() => {
                    window.location.reload();
                  }, 2000);
                }
              })
              .catch((error) => {
                console.error("❌ Cashfree checkout error:", error);
                showAlert(
                  "❌ Failed to open checkout. Please try again.",
                  "error"
                );
              });
          } else {
            // Handle API errors
            hideLoading();
            const errorMessage = data.message || "Failed to create payment";
            showAlert(`❌ ${errorMessage}`, "error");
            console.error("API Error:", data);
          }
        } catch (error) {
          hideLoading();
          showAlert(
            "❌ Network error. Please check your connection and try again.",
            "error"
          );
          console.error("Request Error:", error);
        }
      });

      // Clear form on Escape key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          form.reset();
          amountButtons.forEach((b) => b.classList.remove("active"));
          hideAlert();
        }
      });
    </script>
  </body>
</html>
